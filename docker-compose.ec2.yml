version: '3.8'

services:
  auth:
    build:
      context: ./backend/auth
      dockerfile: Dockerfile
    container_name: medico-auth
    ports:
      - "4000:4000"
    env_file:
      - ./backend/auth/.env
    restart: unless-stopped
    networks:
      - medico-network

  chatbot:
    build:
      context: ./backend/components/chatbot
      dockerfile: Dockerfile
    container_name: medico-chatbot
    ports:
      - "8000:8000"
    env_file:
      - ./backend/components/chatbot/.env
    restart: unless-stopped
    networks:
      - medico-network

  contact:
    build:
      context: ./backend/pages/Contact
      dockerfile: Dockerfile
    container_name: medico-contact
    ports:
      - "5000:5000"
    env_file:
      - ./backend/pages/Contact/.env
    restart: unless-stopped
    networks:
      - medico-network

  prometheus:
    image: prom/prometheus:latest
    container_name: medico-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - auth
      - chatbot
      - contact
    restart: unless-stopped
    networks:
      - medico-network

  grafana:
    image: grafana/grafana:latest
    container_name: medico-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - medico-network

volumes:
  grafana-storage:

networks:
  medico-network:
    driver: bridge
