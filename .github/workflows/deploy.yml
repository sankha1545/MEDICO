name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up SSH agent with your EC2 private key
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_KEY }}

      # 3. Add EC2 host to known_hosts to avoid prompt
      - name: Add EC2 host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 4. SSH into EC2 and deploy backend using Docker Compose
      - name: Deploy backend via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            echo "📁 Navigating to project directory..."
            cd ~/MEDICO

            echo "🔄 Pulling latest code from GitHub..."
            git fetch --all
            git reset --hard origin/main

            echo "🧼 Optional: Prune unused Docker objects (disabled by default)"
            # docker system prune -af

            echo "🛑 Stopping current containers (if any)..."
            docker-compose -f docker-compose.ec2.yml down || true

            echo "🚀 Rebuilding and starting containers in detached mode..."
            docker-compose -f docker-compose.ec2.yml up -d --build

            echo "✅ Backend successfully deployed to EC2!"
          EOF
