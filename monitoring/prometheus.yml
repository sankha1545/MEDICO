global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth:4000']

  - job_name: 'chatbot-service'
    static_configs:
      - targets: ['chatbot:8000']

  - job_name: 'contact-service'
    static_configs:
      - targets: ['contact:5000']
